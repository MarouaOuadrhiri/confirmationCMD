version: '3.8'

# ==============================================================================
# Mediast COD Tracking System - Dashboard Production Docker Compose
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8 Database Service
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mediast-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: secret_db_pass
      MYSQL_DATABASE: gestionCmdMdiast
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret_db_pass"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Express Backend REST API
  # ----------------------------------------------------------------------------
  backend:
    container_name: mediast-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: secret_db_pass
      DB_NAME: gestionCmdMdiast
      JWT_SECRET: super_secret_jwt_mediast_key_2026
    ports:
      - "4000:4000"

  # ----------------------------------------------------------------------------
  # 3. Next.js 14 Responsive Frontend
  # ----------------------------------------------------------------------------
  frontend:
    container_name: mediast-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local

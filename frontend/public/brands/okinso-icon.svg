<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="okinsoGradient" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="okinsoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ec4899" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Modern Serif "O" Monogram -->
  <g filter="url(#subtleGlow)">
    <!-- Outer high-contrast Didone / Luxury Ellipse -->
    <path 
      d="M50 8 C25 8 10 26 10 50 C10 74 25 92 50 92 C75 92 90 74 90 50 C90 26 75 8 50 8 Z M50 14 C68 14 74 30 74 50 C74 70 68 86 50 86 C32 86 26 70 26 50 C26 30 32 14 50 14 Z" 
      fill="url(#okinsoGradient)" 
      fill-rule="evenodd"
    />
    <!-- Delicate central cosmetics spark / pearl accent -->
    <circle cx="50" cy="50" r="4.5" fill="url(#okinsoAccent)" />
    <!-- Fine luxury diamond accents -->
    <path d="M50 20 L52 24 L50 28 L48 24 Z" fill="url(#okinsoAccent)" opacity="0.9" />
    <path d="M50 72 L52 76 L50 80 L48 76 Z" fill="url(#okinsoAccent)" opacity="0.9" />
  </g>
</svg>

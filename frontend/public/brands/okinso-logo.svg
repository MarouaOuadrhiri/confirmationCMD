<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="okinsoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ec4899" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#logoGlow)">
    <!-- Okinso luxury typography -->
    <text x="160" y="70" text-anchor="middle" font-family="'Playfair Display', 'Bodoni MT', 'Didot', 'Georgia', serif" font-size="58" font-weight="700" fill="url(#okinsoTextGrad)" letter-spacing="2">okinso</text>
    <text x="160" y="100" text-anchor="middle" font-family="'Inter', 'Montserrat', sans-serif" font-size="13" font-weight="500" fill="#fbcfe8" letter-spacing="9" opacity="0.9">COSMETICS</text>
  </g>
</svg>
